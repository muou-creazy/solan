<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.title">Solan 外贸独立站 | 运动户外供应链整合</title>
  <!-- 浏览器标签页图标 -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <!-- SEO 关键词：sports protective gear, activewear, outdoor cycling, Amazon supply -->
  <meta name="description" content="Solan - 专业运动护具、健身配件、户外骑行、功能服装供应链整合，12年外贸经验，支持OEM/ODM、DDP、亚马逊FBA供货。" data-i18n-content="meta.description">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"> -->
  <link href="./style/css2.css" rel="stylesheet">
  <link href="./style/index.css" rel="stylesheet">
</head>
<body>
  <!-- 模块由 js/load-commonts.js 从 commonts/ 注入 -->
  <div id="site-header"></div>

  <main>
    <div id="page-home"></div>
    <div class="container" id="page-sections"></div>
  </main>

  <div id="site-footer"></div>
  <div id="site-float"></div>

  <script src="./js/load-commonts.js"></script>
  <script src="./js/translations.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/inquiry.js"></script>
  <script src="./js/pages.js"></script>
  <script src="./js/whatsapp.js"></script>
  <script>
    (function () {
      /** 组件加载完成后的业务初始化 */
      function onCommontsReady() {
        if (window.SolanI18n && typeof window.SolanI18n.init === 'function') {
          window.SolanI18n.init()
        }
        if (window.SolanPages && typeof window.SolanPages.init === 'function') {
          window.SolanPages.init()
        }
        if (window.SolanWhatsApp && typeof window.SolanWhatsApp.init === 'function') {
          window.SolanWhatsApp.init()
        }
        if (window.SolanInquiry) {
          window.SolanInquiry.bindInquiryForm('inquiry-form')
        }

        var navbar = document.getElementById('navbar')
        if (navbar) {
          window.addEventListener('scroll', function () {
            if (window.scrollY > 20) {
              navbar.classList.add('scrolled')
            } else {
              navbar.classList.remove('scrolled')
            }
          })
        }
      }

      document.addEventListener('solan:ready', onCommontsReady)
    })()
  </script>
</body>
</html>
